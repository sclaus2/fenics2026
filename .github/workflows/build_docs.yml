# Simple workflow for deploying static content to GitHub Pages
name: Build docs

on:
    workflow_dispatch:
      inputs:
        base_ref:
          description: Git ref or SHA to compare against for partial PDF rebuilds
          required: false
          type: string
    workflow_call:
      inputs:
        base_ref:
          required: false
          type: string
    pull_request:
      branches:
        - main
      paths:
        - programme.md
        - book/abstracts/**/*.md
        - book/_build/exports/*.pdf
        - book/assets/**
        - book/myst.yml
        - template/**
        - build_book.py
        - convert.py
        - merge-abstracts.py
        - pyproject.toml
        - .github/workflows/build_docs.yml

env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  # You may need to change this to `BASE_URL: ''`
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/scientificcomputing/latex-full:2023-11-07a
    env:
      PUBLISH_DIR: ./book/_build/html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore PDF export cache
        id: pdf-cache
        uses: actions/cache@v4
        with:
          path: book/_build/exports
          key: ${{ runner.os }}-abstract-pdfs-${{ hashFiles('book/myst.yml', 'book/assets/**', 'template/**', 'pyproject.toml', 'build_book.py', 'convert.py', 'merge-abstracts.py') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-abstract-pdfs-${{ hashFiles('book/myst.yml', 'book/assets/**', 'template/**', 'pyproject.toml', 'build_book.py', 'convert.py', 'merge-abstracts.py') }}-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python package tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check container Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install .

      - name: Build programme PDF
        shell: bash
        run: |
          BASE_REF="${{ inputs.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.before }}"
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="origin/main"
          fi
          python build_book.py \
            --changed-only \
            --base-ref "$BASE_REF" \
            --programme programme.md \
            --watermark-doi 10.5281/zenodo.20632492 \
            --watermark-version v2

      - name: Upload book PDF
        uses: actions/upload-artifact@v4
        with:
          name: book-of-abstracts-pdf
          path: fenics2026-book-of-abstracts.pdf

      - name: Build Pages artifact
        run: |
          mkdir -p book/_build/html
          cp fenics2026-book-of-abstracts.pdf book/_build/html/fenics2026-book-of-abstracts.pdf
          cat > book/_build/html/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>FEniCS 2026 Book of Abstracts</title>
            </head>
            <body>
              <main>
                <h1>FEniCS 2026 Book of Abstracts</h1>
                <p><a href="fenics2026-book-of-abstracts.pdf">Download the current PDF</a></p>
              </main>
            </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ${{ env.PUBLISH_DIR }}
